<div class="error__wrapper">
  <div class="error__field">
    <p class="error__message">{{ message }}</p>
    <div class="buttons__wrapper">
      <button class="close__button button" (click)="closeModal()">
        Cancel
      </button>
      <button class="confirm__button button" (click)="confirmModal()">
        Confirm
      </button>
    </div>
  </div>
</div>
